<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- Поле для имени файла (например: note.txt) -->
    <input type="text" id="fileNameInput" placeholder="Имя файла (например: text.txt)">

    <!-- Поле для текста внутри файла -->
    <input type="text" id="fileContentInput" placeholder="Текст внутри файла...">

    <!-- Кнопка, которая запускает создание -->
    <button onclick="createFileOnServer()">Создать файл</button>

    <script>
        async function createFileOnServer() {
            const filename = document.getElementById('fileNameInput').value.trim();
            const contentText = document.getElementById('fileContentInput').value;

            if (!filename) {
                alert("Введите имя файла!");
                return;
            }

            try {
                const response = await fetch('https://pythonanywhere.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name: filename, 
                        content: contentText 
                    })
                });
                const data = await response.json();
                alert(data.message); 
            } catch (error) {
                console.error("Ошибка:", error);
                alert("Не удалось соединиться с сервером.");
            }
        }
    </script>

</body>
</html>
