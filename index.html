<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>

    <input type="text" id="pathInput" placeholder="Пiть фiйла">
    <input type="text" id="fileNameInput" placeholder="фуйл нэйм">
    <input type="text" id="fileContentInput" placeholder="садиржимайе">
    <button onclick="createFileOnServer()">Создать файл</button>

    <script>
        async function createFileOnServer() {
            const customPath = document.getElementById('pathInput').value.trim();
            const filename = document.getElementById('fileNameInput').value.trim();
            const contentText = document.getElementById('fileContentInput').value;

            if (!filename) {
                alert("Введите имя файла!");
                return;
            }

            try {
                // ИСПРАВЛЕНО: адрес написан маленькими буквами и добавлен точный путь /api/storage/file
                const response = await fetch('https://pythonanywhere.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        folder_path: customPath,
                        name: filename, 
                        content: contentText 
                    })
                });

                if (response.ok) {
                    alert("Отправлено!");
                    document.getElementById('fileNameInput').value = '';
                    document.getElementById('fileContentInput').value = '';
                } else {
                    const errorData = await response.json();
                    alert("Ошибка сервера: " + (errorData.detail || "неизвестная"));
                }
            } catch (error) {
                console.error("Ошибка соединения:", error);
                alert("не удалось саеденитса с сiрвiром.");
            }
        }
    </script>

</body>
</html>
